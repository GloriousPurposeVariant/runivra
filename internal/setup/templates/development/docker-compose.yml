# Development stack generated by runivra setup. Edit it freely.
services:
  web:
    build: .
{{- if .HostDatabase}}
    extra_hosts:
      - "host.docker.internal:host-gateway"
{{- else}}
    depends_on:
      db:
        condition: service_healthy
{{- end}}
    ports:
      - "{{.Port}}:8069"
    volumes:
      - ./custom:/opt/odoo/custom
      - ./enterprise:/opt/odoo/enterprise
      - ./odoo.conf:/etc/odoo/odoo.conf
      - odoo-data:/var/lib/odoo
    command: ["odoo", "--dev=xml"]
{{- if not .HostDatabase}}

  db:
    image: postgres:16
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=odoo
      - POSTGRES_PASSWORD=odoo
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
{{- end}}

volumes:
  odoo-data:
{{- if not .HostDatabase}}
  db-data:
{{- end}}
